; Production PHP settings (loaded after the image defaults)
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M

; photo uploads: 10 images x 2 MB, with headroom
upload_max_filesize = 12M
post_max_size = 30M
max_file_uploads = 20

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
; code only changes with a new image, so never re-stat files
opcache.validate_timestamps = 0
