# Laravel routes everything through public/.htaccess (mod_rewrite). Debian's default
# apache2.conf says "AllowOverride None", which silently disables that file and makes
# every URL except "/" return 404, so it has to be enabled for the document root.
ServerName localhost

<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
    Options -Indexes +FollowSymLinks
</Directory>

# do not advertise versions
ServerTokens Prod
ServerSignature Off
